name: Bug
description: Something broken in a public Zygig project
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Project
      options: [ToolsFree, Other public Zygig project]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual, including browser / OS if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
